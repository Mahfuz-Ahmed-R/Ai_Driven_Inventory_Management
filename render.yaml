services:
  - type: web
    name: ai-inventory
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-inventory-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: ai-inventory-db
    plan: free
